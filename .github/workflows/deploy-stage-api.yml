name: Deploy Stage API

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override (defaults to commit SHA)"
        required: false
        type: string
  push:
    branches:
      - 001-wholesale-fashion-platform
    paths:
      - "apps/api/**"
      - "deploy/k8s/**"
      - ".github/workflows/deploy-stage-api.yml"

jobs:
  deploy-stage-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          STAGE_KUBECONFIG_B64: ${{ secrets.STAGE_KUBECONFIG_B64 }}
        run: |
          set -eu
          missing=""
          for key in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL GCP_PROJECT_ID STAGE_KUBECONFIG_B64; do
            eval "value=\${$key:-}"
            if [ -z "$value" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required GitHub secrets:$missing" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Build and push API image
        run: |
          docker build -t us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pet-slay/pet-slay-api:${{ env.IMAGE_TAG }} apps/api
          docker push us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pet-slay/pet-slay-api:${{ env.IMAGE_TAG }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure stage kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.STAGE_KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"

      - name: Validate stage secret exists
        run: |
          kubectl get secret pet-slay-api-secrets -n pet-slay-stage

      - name: Render stage kustomization and deploy
        run: |
          tmpdir="$(mktemp -d)"
          cp -R deploy/k8s "$tmpdir/k8s"
          sed -e "s/PROJECT_ID/${{ secrets.GCP_PROJECT_ID }}/g" -e "s/newTag: stage-latest/newTag: ${{ env.IMAGE_TAG }}/g" "$tmpdir/k8s/stage/kustomization.yaml" > "$tmpdir/k8s/stage/kustomization.rendered.yaml"
          mv "$tmpdir/k8s/stage/kustomization.rendered.yaml" "$tmpdir/k8s/stage/kustomization.yaml"
          kubectl apply -k "$tmpdir/k8s/stage"
