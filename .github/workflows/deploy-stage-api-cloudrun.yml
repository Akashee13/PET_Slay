name: Deploy Stage API (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override (defaults to commit SHA)"
        required: false
        type: string
      region:
        description: "Cloud Run region"
        required: false
        default: "asia-south1"
        type: string
      service:
        description: "Cloud Run service name"
        required: false
        default: "pet-slay-api-stage"
        type: string
  push:
    branches:
      - 001-wholesale-fashion-platform
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-stage-api-cloudrun.yml"

jobs:
  deploy-stage-api-cloudrun:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
      CLOUD_RUN_REGION: ${{ github.event.inputs.region || secrets.GCP_REGION || 'asia-south1' }}
      CLOUD_RUN_SERVICE: ${{ github.event.inputs.service || secrets.CLOUD_RUN_SERVICE_STAGE || 'pet-slay-api-stage' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          STAGE_DATABASE_URL: ${{ secrets.STAGE_DATABASE_URL }}
          STAGE_SUPABASE_URL: ${{ secrets.STAGE_SUPABASE_URL }}
          STAGE_SUPABASE_ANON_KEY: ${{ secrets.STAGE_SUPABASE_ANON_KEY }}
          STAGE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -eu
          missing=""
          for key in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL GCP_PROJECT_ID STAGE_DATABASE_URL STAGE_SUPABASE_URL STAGE_SUPABASE_ANON_KEY STAGE_SUPABASE_SERVICE_ROLE_KEY; do
            eval "value=\${$key:-}"
            if [ -z "$value" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required GitHub secrets:$missing" >&2
            exit 1
          fi

          scripts/validate-stage-database-url.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Run stage database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.STAGE_DATABASE_URL }}
        run: |
          go run ./cmd/migrate

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Build and push API image
        run: |
          docker build -t us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pet-slay/pet-slay-api:${{ env.IMAGE_TAG }} apps/api
          docker push us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pet-slay/pet-slay-api:${{ env.IMAGE_TAG }}

      - name: Deploy API to Cloud Run stage
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$CLOUD_RUN_REGION" \
            --platform managed \
            --image "us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pet-slay/pet-slay-api:${{ env.IMAGE_TAG }}" \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "APP_ENV=stage,DATABASE_REQUIRED=true,DATABASE_URL=${{ secrets.STAGE_DATABASE_URL }},SUPABASE_URL=${{ secrets.STAGE_SUPABASE_URL }},SUPABASE_ANON_KEY=${{ secrets.STAGE_SUPABASE_ANON_KEY }},SUPABASE_SERVICE_ROLE_KEY=${{ secrets.STAGE_SUPABASE_SERVICE_ROLE_KEY }},STAGE_ADMIN_BEARER_TOKEN=${{ secrets.STAGE_ADMIN_BEARER_TOKEN }},FOUNDER_ADMIN_BEARER_TOKEN=${{ secrets.FOUNDER_ADMIN_BEARER_TOKEN }}"

      - name: Show stage URL
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$CLOUD_RUN_REGION" \
            --format='value(status.url)'
